# ShopServer Nginx 反向代理配置示例
# 把 shop.yourdomain.com 换成你的实际域名，把 /path/to/ShopServer.jar 换成实际路径
#
# 部署步骤：
#   1. ./gradlew jar           构建 fat jar
#   2. java -jar ShopServer.jar &  启动（默认监听 0.0.0.0:8080）
#   3. 把此文件放到 /etc/nginx/conf.d/shop.conf
#   4. nginx -t && nginx -s reload

server {
    listen 80;
    server_name shop.yourdomain.com;

    # 把所有请求转发到 Ktor（Ktor 监听 127.0.0.1:8080）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 开启 HTTPS 后自动跳转（80 -> 443）
    # return 301 https://shop.yourdomain.com$request_uri;
}

